<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Tilt+Prism&display=swap"
			rel="stylesheet" />
		<link
			rel="stylesheet"
			href="modern-normalize.css" />
		<link
			rel="stylesheet"
			href="styles.css" />
		<link
			rel="shortcut icon"
			href="./img/logo.png"
			type="image/x-icon" />

		<script
			src="script.js"
			async
			defer></script>
		<title>Farmer Membership Form</title>
	</head>
	<body>
		<form
			action="/"
			method="post"
			class="farmer-signup-form">
			<div class="form-header-img">
				<picture>
					<source
						media="(max-width: 600px)"
						srcset="./img/stardew-mobile.jpg" />
					<source
						media="(min-width: 600px)"
						srcset="./img/stardew.jpg" />
					<img
						src="./img/stardew.jpg"
						alt="Form Header Image" />
				</picture>
				<h1>ARE YOU A FARMER?</h1>
			</div>
			<fieldset class="form-content">
				<h2>Sign up and become a member at our community center</h2>
				<p>Required fields are noted by <span class="required">*</span>.</p>
				<div class="form-controls">
					<div>
						<p>
							<label for="fname"
								>First name <span class="required">*</span></label
							>
						</p>
						<input
							type="text"
							name="fname"
							id="fname"
							placeholder="John"
							required />
					</div>
					<div>
						<p>
							<label for="lname"
								>Last name <span class="required">*</span></label
							>
						</p>
						<input
							type="text"
							name="lname"
							id="lname"
							placeholder="Copper"
							required />
					</div>
					<div>
						<p>
							<label for="email"
								>Email address <span class="required">*</span></label
							>
						</p>
						<input
							type="email"
							name="email"
							id="email"
							placeholder="johncopper@com"
							required />
					</div>
					<div>
						<p>
							<label for="phone-number"
								>Phone number <span class="required">*</span></label
							>
						</p>
						<input
							type="tel"
							name="phone-number"
							id="phone-number"
							placeholder="09*********"
							pattern="^09\d{9}$"
							required />
					</div>
					<div>
						<p>
							<label for="password"
								>Password <span class="required">*</span></label
							>
						</p>
						<input
							type="password"
							id="password"
							name="password"
							placeholder="Create a strong password"
							required />
					</div>
					<div>
						<p>
							<label for="confirm-pass"
								>Confirm password <span class="required">*</span></label
							>
						</p>
						<input
							type="password"
							name="confirm-pass"
							id="confirm-pass"
							placeholder="Please re-type your password"
							required />
					</div>
					<fieldset class="farm-pet-radio">
						<legend>What pet do you have in your farm?</legend>
						<div>
							<input
								type="radio"
								name="farm-pet"
								id="dog" />
							<label for="dog">🐶 Dog</label>
						</div>
						<div>
							<input
								type="radio"
								name="farm-pet"
								id="cat" />
							<label for="cat">🐱 Cat</label>
						</div>
						<div>
							<input
								type="radio"
								name="farm-pet"
								id="horse" />
							<label for="horse">🐴 Horse</label>
						</div>
					</fieldset>
				</div>
				<div class="submission">
					<button
						type="submit"
						class="submit-button">
						REGISTER
					</button>
					<p>Already have an account? <a href="">Log In</a></p>
				</div>
			</fieldset>
		</form>
	</body>
</html>
